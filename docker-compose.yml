# ============================================================
# COMMON AIRFLOW CONFIGURATION
# ============================================================
#
# IMPORTANT:
# x-airflow-common is NOT a service.
# It is a reusable YAML configuration block.
#
# Therefore it must be OUTSIDE the "services:" section.
# ============================================================

x-airflow-common: &airflow-common

  build:
    context: .
    dockerfile: airflow/Dockerfile

  environment: &airflow-common-env

    # --------------------------------------------------------
    # Airflow configuration
    # --------------------------------------------------------

    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

    # Allows Airflow DAGs to import Python modules from:
    #
    # /opt/project/src
    #
    PYTHONPATH: /opt/project


    # --------------------------------------------------------
    # OLTP database connection
    # --------------------------------------------------------

    SOURCE_DB_HOST: postgres-oltp
    SOURCE_DB_PORT: 5432
    SOURCE_DB_NAME: banking
    SOURCE_DB_USER: banking
    SOURCE_DB_PASSWORD: banking


    # --------------------------------------------------------
    # Data Warehouse connection
    # --------------------------------------------------------

    DWH_DB_HOST: postgres-dwh
    DWH_DB_PORT: 5432
    DWH_DB_NAME: banking_dwh
    DWH_DB_USER: dwh
    DWH_DB_PASSWORD: dwh


    # --------------------------------------------------------
    # ClickHouse connection
    # --------------------------------------------------------

    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: 8123
    CLICKHOUSE_DB: banking
    CLICKHOUSE_USER: banking
    CLICKHOUSE_PASSWORD: banking


  # ----------------------------------------------------------
  # Files that Airflow containers need access to
  # ----------------------------------------------------------

  volumes:

    # Airflow DAG files
    - ./airflow/dags:/opt/airflow/dags

    # Airflow logs
    - ./airflow/logs:/opt/airflow/logs

    # Python application/source code
    - ./src:/opt/project/src

    # dbt project
    - ./dbt:/opt/project/dbt

    # SQL scripts
    - ./sql:/opt/project/sql


  # ----------------------------------------------------------
  # Every Airflow service requires Airflow PostgreSQL
  # ----------------------------------------------------------

  depends_on:

    airflow-postgres:
      condition: service_healthy



# ============================================================
# ACTUAL DOCKER SERVICES
# ============================================================

services:


  # ==========================================================
  # POSTGRESQL OLTP
  # ==========================================================
  #
  # Operational transactional database.
  #
  # Host:
  # localhost:15432
  #
  # Inside Docker network:
  # postgres-oltp:5432
  # ==========================================================

  postgres-oltp:

    image: postgres:17

    container_name: banking-postgres-oltp

    environment:

      POSTGRES_DB: banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking

    ports:

      - "15432:5432"

    volumes:

      - postgres_oltp_data:/var/lib/postgresql/data

      - ./sql/oltp/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U banking -d banking"
        ]

      interval: 10s

      timeout: 5s

      retries: 5

  # ==========================================================
  # POSTGRESQL DATA WAREHOUSE
  # ==========================================================
  #
  # Warehouse used for transformed analytical data.
  #
  # Host:
  # localhost:5433
  #
  # Inside Docker:
  # postgres-dwh:5432
  # ==========================================================

  postgres-dwh:

    image: postgres:17

    container_name: banking-postgres-dwh

    environment:

      POSTGRES_DB: banking_dwh
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh

    ports:

      - "5433:5432"

    volumes:

      - postgres_dwh_data:/var/lib/postgresql/data

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U dwh -d banking_dwh"
        ]

      interval: 10s

      timeout: 5s

      retries: 5

  # ==========================================================
  # KAFKA
  # ==========================================================
  #
  # Event streaming platform.
  #
  # Your Python producer running on Windows connects to:
  #
  # localhost:9092
  #
  # ==========================================================

  kafka:

    image: apache/kafka:latest

    container_name: banking-kafka

    ports:

      - "9092:9092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        PLAINTEXT://:9092,
        CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1



  # ==========================================================
  # CLICKHOUSE
  # ==========================================================
  #
  # Analytical database.
  #
  # HTTP interface:
  # localhost:8123
  #
  # Native interface:
  # localhost:9000
  #
  # ==========================================================

  clickhouse:

    image: clickhouse/clickhouse-server:23.8

    container_name: banking-clickhouse

    ports:

      - "8123:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_DB: banking
      CLICKHOUSE_USER: banking
      CLICKHOUSE_PASSWORD: banking
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

    volumes:

      - clickhouse_data:/var/lib/clickhouse



  # ==========================================================
  # AIRFLOW METADATA POSTGRESQL
  # ==========================================================
  #
  # Important:
  #
  # This is NOT your banking database.
  #
  # Airflow uses this database internally to store:
  #
  # DAG runs
  # task states
  # schedules
  # connections
  # metadata
  # etc.
  #
  # ==========================================================

  airflow-postgres:

    image: postgres:17

    container_name: banking-airflow-postgres

    environment:

      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow

    volumes:

      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U airflow -d airflow"
        ]

      interval: 10s

      timeout: 5s

      retries: 5



  # ==========================================================
  # AIRFLOW INITIALIZATION
  # ==========================================================
  #
  # Runs:
  #
  # airflow db migrate
  #
  # This container SHOULD terminate afterwards.
  #
  # Successful state:
  #
  # Exited (0)
  #
  # That is NOT an error.
  # ==========================================================

  airflow-init:

    <<: *airflow-common

    container_name: banking-airflow-init

    command: db migrate

    restart: "no"



  # ==========================================================
  # AIRFLOW API SERVER / WEB UI
  # ==========================================================
  #
  # Airflow 3 uses api-server.
  #
  # Browser:
  #
  # http://localhost:8080
  #
  # ==========================================================

  airflow-api-server:

    <<: *airflow-common

    container_name: banking-airflow-api-server

    command: api-server

    ports:

      - "8080:8080"

    depends_on:

      airflow-postgres:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully



  # ==========================================================
  # AIRFLOW SCHEDULER
  # ==========================================================
  #
  # Determines when DAGs/tasks should execute.
  # ==========================================================

  airflow-scheduler:

    <<: *airflow-common

    container_name: banking-airflow-scheduler

    command: scheduler

    depends_on:

      airflow-postgres:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully



  # ==========================================================
  # AIRFLOW DAG PROCESSOR
  # ==========================================================
  #
  # Parses DAG Python files separately from the scheduler.
  #
  # This is normal for newer Airflow architecture.
  # ==========================================================

  airflow-dag-processor:

    <<: *airflow-common

    container_name: banking-airflow-dag-processor

    command: dag-processor

    depends_on:

      airflow-postgres:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully



# ============================================================
# PERSISTENT DOCKER VOLUMES
# ============================================================

volumes:

  postgres_oltp_data:

  postgres_dwh_data:

  clickhouse_data:

  airflow_postgres_data: