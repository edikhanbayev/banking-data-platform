version: 2

models:
  - name: stg_transactions
    columns:

      - name: transaction_id
        data_tests:
          - not_null
          - unique

      - name: account_id
        data_tests:
          - not_null

      - name: amount
        data_tests:
          - not_null

      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - COMPLETED
                  - DECLINED